<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digz N' Lidz | Coming Soon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png">
<link rel="manifest" href="/assets/favicon/site.webmanifest">
<style>
  :root {
    --site-black: #141414;
    --bone: #f5f0e6;
    --gold: #f0a91e;
    --dig-green: #1f3324;
    --grey: #8a8f94;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--site-black);
    color: var(--bone);
    font-family: 'Oswald', Arial Narrow, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; }
  .badge {
    display: inline-block;
    border: 2px solid var(--gold);
    color: var(--gold);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 3px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 34px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  p {
    color: var(--grey);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .stripes {
    height: 10px;
    width: 100%;
    margin: 32px 0;
    background: repeating-linear-gradient(
      45deg,
      var(--gold),
      var(--gold) 14px,
      var(--site-black) 14px,
      var(--site-black) 28px
    );
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Digging soon</span>
    <h1>Digz N' Lidz</h1>
    <p>We're putting the finishing touches on the RC Experience Cafe.</p>
    <p>Bookings open shortly, check back soon.</p>
    <div class="stripes"></div>
  </div>
</body>
</html>
